<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GasControl</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/gas-management/manifest.json">
  <meta name="theme-color" content="#0b1120">
  
  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GasControl">
  <link rel="apple-touch-icon" href="/gas-management/images/icon-192.png">

  <!-- Android Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/gas-management/sw.js', { scope: '/gas-management/' })
          .then((reg) => console.log('SW registrado com sucesso:', reg.scope))
          .catch((err) => console.warn('Erro ao registrar SW:', err));
      });
    }
  </script>
</body>
</html>

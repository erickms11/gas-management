<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GasControl - Gerenciador de Consumo de Gasolina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GasControl">

  <!-- React & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js para Gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- QRCode.js para conexão rápida via QR Code -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      });
    }
  </script>

  <style>
    /* TEMAS: DARK E LIGHT */
    html[data-theme="dark"] {
      --bg-main: #0b1120;
      --bg-surface: #151e32;
      --bg-card: rgba(30, 41, 69, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    html[data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    :root {
      --primary: #0284c7;
      --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      --accent-fuel: #f59e0b;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; transition: background-color 0.3s ease, color 0.3s ease; }
    
    .app-container { max-width: 600px; margin: 0 auto; padding: 16px; }
    
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* Header */
    .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #f59e0b, #d97706); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
    .brand-title { font-size: 1.3rem; font-weight: 800; color: var(--text-main); }
    
    .theme-toggle-btn { background: var(--bg-surface); border: 1px solid var(--border-color); width: 38px; height: 38px; border-radius: 50%; color: var(--text-main); font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; }
    .theme-toggle-btn:hover { transform: scale(1.08); }

    /* Card Perfil do Veículo */
    .vehicle-profile-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .vehicle-avatar {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid var(--primary);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    .vehicle-info { flex: 1; }
    .vehicle-name { font-size: 1.05rem; font-weight: 800; color: var(--text-main); }
    .vehicle-details { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
    .stat-value { font-size: 1.45rem; font-weight: 800; margin: 4px 0; color: var(--text-main); }
    .stat-unit { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; margin-left: 3px; }

    /* Buttons */
    .btn-primary { width: 100%; background: var(--primary-gradient); color: #fff; border: none; padding: 14px; border-radius: var(--radius-md); font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 16px rgba(56, 189, 248, 0.35); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: var(--radius-md); font-size: 0.82rem; font-weight: 700; cursor: pointer; }

    /* Forms & Modal */
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .form-input, .form-select { width: 100%; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; color: var(--text-main); font-size: 0.95rem; outline: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
    @media (min-width: 600px) { .modal-overlay { align-items: center; padding: 20px; } }
    .modal-content { background: var(--bg-surface); border: 1px solid var(--border-color); border-top-left-radius: 24px; border-top-right-radius: 24px; width: 100%; max-width: 520px; padding: 24px; max-height: 90vh; overflow-y: auto; color: var(--text-main); }
    @media (min-width: 600px) { .modal-content { border-radius: 24px; } }

    /* Refuel Items */
    .refuel-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 10px; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge-gasolina { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge-etanol { background: rgba(16, 185, 129, 0.2); color: #10b981; }

    /* Seleção de miniaturas */
    .thumb-picker { display: flex; gap: 10px; margin-top: 6px; overflow-x: auto; padding-bottom: 6px; }
    .thumb-option { width: 56px; height: 56px; border-radius: 14px; border: 2px solid transparent; cursor: pointer; object-fit: cover; background: #000; flex-shrink: 0; }
    .thumb-option.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3); }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-surface); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 12px; z-index: 100; max-width: 600px; margin: 0 auto; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-muted); font-size: 0.72rem; font-weight: 600; cursor: pointer; padding: 6px; }
    .nav-btn.active { color: var(--primary); }
    .fab { width: 50px; height: 50px; border-radius: 50%; background: var(--primary-gradient); color: #fff; border: none; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4); cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_THUMBNAILS = [
      { id: 't1', url: 'images/car_onix.jpg', name: 'Hatch Branco' },
      { id: 't2', url: 'images/car_corolla.jpg', name: 'Sedan Prata' },
      { id: 't3', url: 'https://images.unsplash.com/photo-1541348263662-e082662d82da?w=200&auto=format&fit=crop&q=80', name: 'SUV Preto' },
      { id: 't4', url: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=200&auto=format&fit=crop&q=80', name: 'Esportivo Azul' }
    ];

    const INITIAL_VEHICLES = [
      { id: 'v1', name: 'Meu Carro Principal', brand: 'Chevrolet', model: 'Onix 1.0 Flex', year: 2022, plate: 'ABC-1D23', odometer: 34850, photoUrl: 'images/car_onix.jpg' },
      { id: 'v2', name: 'Carro Família', brand: 'Toyota', model: 'Corolla 2.0', year: 2021, plate: 'XYZ-9876', odometer: 52100, photoUrl: 'images/car_corolla.jpg' }
    ];

    const INITIAL_REFUELINGS = [
      { id: 'r1', vehicleId: 'v1', date: '2026-09-01', odometer: 33400, liters: 38.5, price: 5.79, total: 222.91, fuel: 'Gasolina Comum', station: 'Posto Shell Central' },
      { id: 'r2', vehicleId: 'v1', date: '2026-09-12', odometer: 33880, liters: 36.2, price: 3.89, total: 140.81, fuel: 'Etanol', station: 'Posto Ipiranga' },
      { id: 'r3', vehicleId: 'v1', date: '2026-09-22', odometer: 34320, liters: 37.0, price: 5.85, total: 216.45, fuel: 'Gasolina Aditivada', station: 'Posto BR Petrobras' },
      { id: 'r4', vehicleId: 'v1', date: '2026-10-01', odometer: 34850, liters: 39.1, price: 5.75, total: 224.82, fuel: 'Gasolina Comum', station: 'Posto Shell Central' }
    ];

    const INITIAL_MAINTENANCE = [
      { id: 'm1', vehicleId: 'v1', title: 'Troca de Óleo e Filtro de Óleo', kmTarget: 40000, category: 'Óleo', completed: false },
      { id: 'm2', vehicleId: 'v1', title: 'Alinhamento e Balanceamento', kmTarget: 38000, category: 'Pneus', completed: false },
      { id: 'm3', vehicleId: 'v1', title: 'Pagamento IPVA 2026', kmTarget: 0, category: 'Imposto', completed: true }
    ];

    function App() {
      // Estado de Tema (Dark / Light)
      const [theme, setTheme] = useState(() => localStorage.getItem('gas_theme') || 'dark');

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('gas_theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      // Veículos e Ativo
      const [vehicles, setVehicles] = useState(() => {
        const saved = localStorage.getItem('gas_vehicles');
        return saved ? JSON.parse(saved) : INITIAL_VEHICLES;
      });

      const [activeVehicleId, setActiveVehicleId] = useState(() => {
        return localStorage.getItem('gas_active_v') || 'v1';
      });

      useEffect(() => {
        localStorage.setItem('gas_vehicles', JSON.stringify(vehicles));
      }, [vehicles]);

      useEffect(() => {
        localStorage.setItem('gas_active_v', activeVehicleId);
      }, [activeVehicleId]);

      const activeVehicle = vehicles.find(v => v.id === activeVehicleId) || vehicles[0];

      // Abastecimentos
      const [refuelings, setRefuelings] = useState(() => {
        const saved = localStorage.getItem('gas_refuels');
        return saved ? JSON.parse(saved) : INITIAL_REFUELINGS;
      });

      // Manutenções
      const [maintenance, setMaintenance] = useState(() => {
        const saved = localStorage.getItem('gas_maintenance');
        return saved ? JSON.parse(saved) : INITIAL_MAINTENANCE;
      });

      useEffect(() => {
        localStorage.setItem('gas_refuels', JSON.stringify(refuelings));
      }, [refuelings]);

      useEffect(() => {
        localStorage.setItem('gas_maintenance', JSON.stringify(maintenance));
      }, [maintenance]);

      // Modais e Abas
      const [activeTab, setActiveTab] = useState('inicio');
      const [isRefuelModalOpen, setIsRefuelModalOpen] = useState(false);
      const [isVehicleModalOpen, setIsVehicleModalOpen] = useState(false);
      const [isQrModalOpen, setIsQrModalOpen] = useState(false);
      const qrCanvasRef = useRef(null);

      const localAppUrl = 'http://192.168.15.138:8080';

      useEffect(() => {
        if (isQrModalOpen && qrCanvasRef.current && window.QRCode) {
          window.QRCode.toCanvas(qrCanvasRef.current, localAppUrl, { width: 200, margin: 2 }, (err) => {
            if (err) console.error(err);
          });
        }
      }, [isQrModalOpen]);

      // Formulário Cadastro de Veículo
      const [vName, setVName] = useState('');
      const [vBrand, setVBrand] = useState('Chevrolet');
      const [vModel, setVModel] = useState('Onix 1.0 Flex');
      const [vYear, setVYear] = useState('2023');
      const [vPlate, setVPlate] = useState('');
      const [vOdometer, setVOdometer] = useState('35000');
      const [vPhotoUrl, setVPhotoUrl] = useState('images/car_onix.jpg');

      // Calculadora Flex
      const [ethPrice, setEthPrice] = useState('3.89');
      const [gasPrice, setGasPrice] = useState('5.79');
      const [flexRatio, setFlexRatio] = useState(70);

      // Form Abastecimento
      const [formOdometer, setFormOdometer] = useState('35300');
      const [formLiters, setFormLiters] = useState('36.5');
      const [formPrice, setFormPrice] = useState('5.75');
      const [formFuel, setFormFuel] = useState('Gasolina Comum');
      const [formStation, setFormStation] = useState('Posto Shell');

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Abastecimentos do veículo ativo
      const vehicleRefuels = refuelings.filter(r => r.vehicleId === activeVehicleId);
      const processedRefuels = vehicleRefuels.sort((a,b) => a.odometer - b.odometer).map((item, index, arr) => {
        if (index === 0) return { ...item, kmDriven: 0, kml: 0, costPerKm: 0 };
        const prev = arr[index - 1];
        const kmDriven = item.odometer - prev.odometer;
        const kml = item.liters > 0 ? kmDriven / item.liters : 0;
        const costPerKm = kmDriven > 0 ? item.total / kmDriven : 0;
        return { ...item, kmDriven, kml, costPerKm };
      });

      const totalSpent = processedRefuels.reduce((acc, r) => acc + r.total, 0);
      const totalLiters = processedRefuels.reduce((acc, r) => acc + r.liters, 0);
      const firstOdo = processedRefuels.length > 0 ? processedRefuels[0].odometer : (activeVehicle?.odometer || 0);
      const lastOdo = processedRefuels.length > 0 ? processedRefuels[processedRefuels.length - 1].odometer : (activeVehicle?.odometer || 0);
      const totalKm = lastOdo - firstOdo;
      
      const validKmls = processedRefuels.filter(r => r.kml > 0);
      const avgKml = validKmls.length > 0 ? validKmls.reduce((acc, r) => acc + r.kml, 0) / validKmls.length : 0;
      const avgCostPerKm = totalKm > 0 ? totalSpent / totalKm : 0;

      // Renderizar Gráfico
      useEffect(() => {
        if (activeTab === 'inicio' && chartRef.current) {
          if (chartInstance.current) chartInstance.current.destroy();

          const ctx = chartRef.current.getContext('2d');
          const labels = processedRefuels.map(r => r.date.split('-').slice(1).reverse().join('/'));
          const prices = processedRefuels.map(r => r.price);

          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels.length > 0 ? labels : ['Sem dados'],
              datasets: [{
                label: 'Preço/Litro (R$)',
                data: prices.length > 0 ? prices : [0],
                borderColor: '#0284c7',
                backgroundColor: 'rgba(2, 132, 199, 0.12)',
                fill: true,
                tension: 0.35,
                borderWidth: 3
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { color: theme === 'dark' ? '#94a3b8' : '#475569' }, grid: { color: theme === 'dark' ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' } },
                y: { ticks: { color: theme === 'dark' ? '#94a3b8' : '#475569' }, grid: { color: theme === 'dark' ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' } }
              }
            }
          });
        }
      }, [activeTab, refuelings, activeVehicleId, theme]);

      // Calculadora Flex
      const numEth = parseFloat(ethPrice) || 0;
      const numGas = parseFloat(gasPrice) || 0;
      const ratio = numGas > 0 ? (numEth / numGas) * 100 : 0;
      const flexRecommended = ratio > 0 && ratio <= flexRatio ? 'Etanol' : 'Gasolina';

      // Handler para Upload de Foto do Veículo (File -> Base64)
      const handlePhotoFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setVPhotoUrl(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // Cadastrar Veículo
      const handleSaveVehicle = (e) => {
        e.preventDefault();
        if (!vName.trim() || !vModel.trim()) return;

        const newV = {
          id: 'v_' + Date.now(),
          name: vName.trim(),
          brand: vBrand.trim(),
          model: vModel.trim(),
          year: parseInt(vYear, 10) || 2023,
          plate: vPlate.trim() || 'Sem Placa',
          odometer: parseInt(vOdometer, 10) || 0,
          photoUrl: vPhotoUrl || 'images/car_onix.jpg'
        };

        const updated = [...vehicles, newV];
        setVehicles(updated);
        setActiveVehicleId(newV.id);
        setIsVehicleModalOpen(false);

        // Resetar form
        setVName('');
        setVModel('');
        setVPlate('');
      };

      const handleAddRefuel = (e) => {
        e.preventDefault();
        const odo = parseInt(formOdometer, 10);
        const lit = parseFloat(formLiters);
        const prc = parseFloat(formPrice);
        if (!odo || !lit || !prc) return;

        const newR = {
          id: 'r_' + Date.now(),
          vehicleId: activeVehicleId,
          date: new Date().toISOString().split('T')[0],
          odometer: odo,
          liters: lit,
          price: prc,
          total: lit * prc,
          fuel: formFuel,
          station: formStation || 'Posto'
        };

        setRefuelings([...refuelings, newR]);
        setIsRefuelModalOpen(false);
      };

      const handleDeleteRefuel = (id) => {
        if (confirm('Excluir este abastecimento?')) {
          setRefuelings(refuelings.filter(r => r.id !== id));
        }
      };

      const toggleMaintenance = (id) => {
        setMaintenance(maintenance.map(m => m.id === id ? { ...m, completed: !m.completed } : m));
      };

      return (
        <div className="app-container">
          {/* Top Bar com Troca de Tema */}
          <header className="app-header">
            <div className="brand">
              <div className="brand-icon">⛽</div>
              <div>
                <h1 className="brand-title">GasControl</h1>
                <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>Gerenciamento de Gasolina</span>
              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              <button
                className="btn-secondary"
                style={{ padding: '6px 12px', fontSize: '0.8rem', display: 'flex', alignItems: 'center', gap: '4px', borderColor: 'var(--primary)', color: 'var(--primary)' }}
                onClick={() => setIsQrModalOpen(true)}
              >
                📱 Conectar S22
              </button>
              <button className="theme-toggle-btn" onClick={toggleTheme} title="Alternar Tema (Escuro / Claro)">
                {theme === 'dark' ? '☀️' : '🌙'}
              </button>
            </div>
          </header>

          {/* Card Perfil do Veículo Ativo & Miniatura */}
          {activeVehicle && (
            <div className="vehicle-profile-card">
              <img src={activeVehicle.photoUrl} alt={activeVehicle.name} className="vehicle-avatar" />

              <div className="vehicle-info">
                <div className="vehicle-name">{activeVehicle.name}</div>
                <div className="vehicle-details">
                  {activeVehicle.brand} {activeVehicle.model} ({activeVehicle.year}) • {activeVehicle.plate}
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', alignItems: 'flex-end' }}>
                <select
                  className="form-select"
                  style={{ padding: '4px 8px', fontSize: '0.78rem', width: 'auto' }}
                  value={activeVehicleId}
                  onChange={e => setActiveVehicleId(e.target.value)}
                >
                  {vehicles.map(v => (
                    <option key={v.id} value={v.id}>🚗 {v.name}</option>
                  ))}
                </select>

                <button className="btn-secondary" style={{ padding: '3px 8px', fontSize: '0.72rem' }} onClick={() => setIsVehicleModalOpen(true)}>
                  + Novo Veículo
                </button>
              </div>
            </div>
          )}

          {/* TAB 1: INÍCIO / DASHBOARD */}
          {activeTab === 'inicio' && (
            <div>
              {/* Cards de Métricas */}
              <div className="stats-grid">
                <div className="glass-card" style={{ marginBottom: 0 }}>
                  <div className="stat-header"><span>Média Consumo</span><span>📊</span></div>
                  <div className="stat-value">{avgKml > 0 ? avgKml.toFixed(2) : '--'} <span className="stat-unit">Km/L</span></div>
                  <span style={{ fontSize: '0.7rem', color: 'var(--text-dim)' }}>Média real calculada</span>
                </div>

                <div className="glass-card" style={{ marginBottom: 0 }}>
                  <div className="stat-header"><span>Custo por Km</span><span>💵</span></div>
                  <div className="stat-value">R$ {avgCostPerKm > 0 ? avgCostPerKm.toFixed(2) : '0,00'} <span className="stat-unit">/Km</span></div>
                  <span style={{ fontSize: '0.7rem', color: 'var(--text-dim)' }}>Gasto por distância</span>
                </div>

                <div className="glass-card" style={{ marginBottom: 0 }}>
                  <div className="stat-header"><span>Total Gasto</span><span>⛽</span></div>
                  <div className="stat-value" style={{ fontSize: '1.25rem' }}>R$ {totalSpent.toFixed(2)}</div>
                  <span style={{ fontSize: '0.7rem', color: 'var(--text-dim)' }}>{totalLiters.toFixed(1)} Litros totais</span>
                </div>

                <div className="glass-card" style={{ marginBottom: 0 }}>
                  <div className="stat-header"><span>Distância Total</span><span>📍</span></div>
                  <div className="stat-value" style={{ fontSize: '1.25rem' }}>{totalKm} <span className="stat-unit">Km</span></div>
                  <span style={{ fontSize: '0.7rem', color: 'var(--text-dim)' }}>Odômetro: {lastOdo} Km</span>
                </div>
              </div>

              {/* Gráfico de Evolução de Preços */}
              <div className="glass-card">
                <h3 style={{ fontSize: '0.95rem', fontWeight: 700, marginBottom: '12px' }}>Evolução do Preço da Gasolina (R$/L)</h3>
                <canvas ref={chartRef} height="140"></canvas>
              </div>

              {/* Histórico Recente */}
              <div style={{ marginTop: '10px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <h3 style={{ fontSize: '1rem', fontWeight: 700 }}>Últimos Abastecimentos</h3>
                  <span style={{ fontSize: '0.78rem', color: 'var(--primary)', cursor: 'pointer', fontWeight: 700 }} onClick={() => setActiveTab('historico')}>Ver todos</span>
                </div>

                {[...processedRefuels].reverse().slice(0, 3).map(item => (
                  <div key={item.id} className="refuel-item">
                    <div>
                      <span className={`badge ${item.fuel.includes('Etanol') ? 'badge-etanol' : 'badge-gasolina'}`}>{item.fuel}</span>
                      <div style={{ fontWeight: 700, fontSize: '0.9rem', marginTop: '4px' }}>{item.station}</div>
                      <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{item.liters} L × R$ {item.price.toFixed(2)} | Odômetro: {item.odometer} Km</div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontWeight: 800, color: 'var(--primary)', fontSize: '1rem' }}>R$ {item.total.toFixed(2)}</div>
                      {item.kml > 0 && <div style={{ fontSize: '0.78rem', color: 'var(--accent-green)', fontWeight: 700 }}>⚡ {item.kml.toFixed(2)} Km/L</div>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 2: HISTÓRICO COMPLETO */}
          {activeTab === 'historico' && (
            <div>
              <h3 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '14px' }}>Histórico do Veículo</h3>
              {processedRefuels.length === 0 ? (
                <div className="glass-card" style={{ textAlign: 'center', padding: '24px', color: 'var(--text-muted)' }}>
                  Nenhum abastecimento registrado para este veículo.
                </div>
              ) : (
                [...processedRefuels].reverse().map(item => (
                  <div key={item.id} className="refuel-item">
                    <div>
                      <span className={`badge ${item.fuel.includes('Etanol') ? 'badge-etanol' : 'badge-gasolina'}`}>{item.fuel}</span>
                      <div style={{ fontWeight: 700, fontSize: '0.92rem', marginTop: '4px' }}>{item.station}</div>
                      <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{item.date} • {item.liters} Litros • R$ {item.price.toFixed(2)}/L</div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-dim)', marginTop: '2px' }}>Odômetro: {item.odometer} Km {item.kmDriven > 0 && `(+${item.kmDriven} Km)`}</div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontWeight: 800, color: 'var(--primary)', fontSize: '1.05rem' }}>R$ {item.total.toFixed(2)}</div>
                      {item.kml > 0 && <div style={{ fontSize: '0.78rem', color: 'var(--accent-green)', fontWeight: 700 }}>⚡ {item.kml.toFixed(2)} Km/L</div>}
                      <button onClick={() => handleDeleteRefuel(item.id)} style={{ background: 'none', border: 'none', color: '#ef4444', fontSize: '0.75rem', cursor: 'pointer', marginTop: '6px' }}>Excluir</button>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {/* TAB 3: CALCULADORA FLEX */}
          {activeTab === 'flex' && (
            <div className="glass-card">
              <h3 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '6px' }}>🔥 Calculadora Flex</h3>
              <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '16px' }}>Saiba instantaneamente se compensa abastecer com Etanol ou Gasolina.</p>

              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Preço Etanol (R$)</label>
                  <input type="number" step="0.01" className="form-input" value={ethPrice} onChange={e => setEthPrice(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Preço Gasolina (R$)</label>
                  <input type="number" step="0.01" className="form-input" value={gasPrice} onChange={e => setGasPrice(e.target.value)} />
                </div>
              </div>

              <div style={{ margin: '14px 0' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                  <span>Fator de Rendimento (Regra Nacional):</span>
                  <span style={{ fontWeight: 700, color: 'var(--primary)' }}>{flexRatio}%</span>
                </div>
                <input type="range" min="65" max="75" value={flexRatio} onChange={e => setFlexRatio(e.target.value)} style={{ width: '100%', accentColor: 'var(--primary)', marginTop: '6px' }} />
              </div>

              {ratio > 0 && (
                <div style={{ background: flexRecommended === 'Etanol' ? 'rgba(16, 185, 129, 0.15)' : 'rgba(245, 158, 11, 0.15)', border: `1px solid ${flexRecommended === 'Etanol' ? '#10b981' : '#f59e0b'}`, borderRadius: '16px', padding: '16px', textAlign: 'center', marginTop: '16px' }}>
                  <span style={{ fontSize: '0.75rem', fontWeight: 700, textTransform: 'uppercase', color: 'var(--text-muted)' }}>Recomendação</span>
                  <div style={{ fontSize: '1.6rem', fontWeight: 800, color: flexRecommended === 'Etanol' ? '#10b981' : '#f59e0b', marginTop: '4px' }}>
                    ⚡ ABASTEÇA COM {flexRecommended.toUpperCase()}
                  </div>
                  <p style={{ fontSize: '0.85rem', marginTop: '6px' }}>
                    O Etanol está custando <strong>{ratio.toFixed(1)}%</strong> da Gasolina. {ratio <= flexRatio ? `Abaixo do limite de ${flexRatio}%. Vale a pena!` : `Acima de ${flexRatio}%. A gasolina rende mais.`}
                  </p>
                </div>
              )}
            </div>
          )}

          {/* TAB 4: MANUTENÇÃO */}
          {activeTab === 'manutencao' && (
            <div>
              <h3 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '14px' }}>🛠️ Manutenções Preventivas</h3>
              {maintenance.map(item => {
                const remaining = item.kmTarget ? item.kmTarget - lastOdo : null;
                return (
                  <div key={item.id} className="glass-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', opacity: item.completed ? 0.6 : 1 }}>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: '0.95rem', textDecoration: item.completed ? 'line-through' : 'none' }}>{item.title}</div>
                      <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '4px' }}>
                        {item.kmTarget > 0 ? `Revisão aos ${item.kmTarget} Km` : 'Lembrete agendado'}
                        {remaining !== null && !item.completed && (
                          <span style={{ marginLeft: '8px', color: remaining <= 1000 ? '#ef4444' : '#10b981', fontWeight: 700 }}>
                            ({remaining > 0 ? `Faltam ${remaining} Km` : 'Vencida!'})
                          </span>
                        )}
                      </div>
                    </div>
                    <button onClick={() => toggleMaintenance(item.id)} style={{ background: item.completed ? 'var(--accent-green)' : 'rgba(255,255,255,0.1)', border: 'none', color: '#fff', borderRadius: '50%', width: '32px', height: '32px', cursor: 'pointer', fontSize: '1rem' }}>
                      {item.completed ? '✓' : '○'}
                    </button>
                  </div>
                );
              })}
            </div>
          )}

          {/* MODAL CADASTRAR NOVO VEÍCULO */}
          {isVehicleModalOpen && (
            <div className="modal-overlay" onClick={() => setIsVehicleModalOpen(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.1rem', fontWeight: 700 }}>🚘 Cadastrar Novo Veículo</h3>
                  <button onClick={() => setIsVehicleModalOpen(false)} style={{ background: 'none', border: 'none', color: 'var(--text-main)', fontSize: '1.2rem', cursor: 'pointer' }}>✕</button>
                </div>

                <form onSubmit={handleSaveVehicle}>
                  <div className="form-group">
                    <label className="form-label">Nome de Identificação</label>
                    <input type="text" className="form-input" placeholder="Ex: Meu Carro de Trabalho" value={vName} onChange={e => setVName(e.target.value)} required />
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Marca</label>
                      <input type="text" className="form-input" placeholder="Ex: Chevrolet" value={vBrand} onChange={e => setVBrand(e.target.value)} required />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Modelo</label>
                      <input type="text" className="form-input" placeholder="Ex: Onix 1.0 Turbo" value={vModel} onChange={e => setVModel(e.target.value)} required />
                    </div>
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Ano</label>
                      <input type="number" className="form-input" value={vYear} onChange={e => setVYear(e.target.value)} required />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Placa (Opcional)</label>
                      <input type="text" className="form-input" placeholder="Ex: ABC-1D23" value={vPlate} onChange={e => setVPlate(e.target.value)} />
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Odômetro Inicial (Km)</label>
                    <input type="number" className="form-input" value={vOdometer} onChange={e => setVOdometer(e.target.value)} required />
                  </div>

                  {/* MINIATURA / FOTO DO VEÍCULO */}
                  <div className="form-group">
                    <label className="form-label">Selecione uma Miniatura ou Envie Foto</label>
                    <div className="thumb-picker">
                      {DEFAULT_THUMBNAILS.map(t => (
                        <img
                          key={t.id}
                          src={t.url}
                          alt={t.name}
                          className={`thumb-option ${vPhotoUrl === t.url ? 'selected' : ''}`}
                          onClick={() => setVPhotoUrl(t.url)}
                          title={t.name}
                        />
                      ))}
                    </div>

                    <div style={{ marginTop: '10px' }}>
                      <label className="form-label" style={{ fontSize: '0.75rem' }}>Ou faça upload de uma foto do seu dispositivo:</label>
                      <input type="file" accept="image/*" onChange={handlePhotoFileUpload} style={{ fontSize: '0.8rem', marginTop: '4px' }} />
                    </div>
                  </div>

                  {vPhotoUrl && (
                    <div style={{ textAlign: 'center', margin: '12px 0' }}>
                      <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Pré-visualização:</span>
                      <img src={vPhotoUrl} alt="Preview" style={{ width: '70px', height: '70px', borderRadius: '18px', objectFit: 'cover', display: 'block', margin: '6px auto', border: '2px solid var(--primary)' }} />
                    </div>
                  )}

                  <button type="submit" className="btn-primary" style={{ marginTop: '12px' }}>Salvar Veículo</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ADICIONAR ABASTECIMENTO */}
          {isRefuelModalOpen && (
            <div className="modal-overlay" onClick={() => setIsRefuelModalOpen(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.1rem', fontWeight: 700 }}>⛽ Novo Abastecimento</h3>
                  <button onClick={() => setIsRefuelModalOpen(false)} style={{ background: 'none', border: 'none', color: 'var(--text-main)', fontSize: '1.2rem', cursor: 'pointer' }}>✕</button>
                </div>

                <form onSubmit={handleAddRefuel}>
                  <div className="form-group">
                    <label className="form-label">Odômetro Atual (Km)</label>
                    <input type="number" className="form-input" value={formOdometer} onChange={e => setFormOdometer(e.target.value)} required />
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Litros</label>
                      <input type="number" step="0.01" className="form-input" value={formLiters} onChange={e => setFormLiters(e.target.value)} required />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Preço por Litro (R$)</label>
                      <input type="number" step="0.01" className="form-input" value={formPrice} onChange={e => setFormPrice(e.target.value)} required />
                    </div>
                  </div>

                  <div style={{ background: 'var(--bg-surface)', padding: '10px', borderRadius: '10px', textAlign: 'center', marginBottom: '12px', border: '1px solid var(--border-color)' }}>
                    <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Total Estimado:</span>
                    <div style={{ fontSize: '1.3rem', fontWeight: 800, color: 'var(--primary)' }}>R$ {((parseFloat(formLiters)||0)*(parseFloat(formPrice)||0)).toFixed(2)}</div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Tipo de Combustível</label>
                    <select className="form-select" value={formFuel} onChange={e => setFormFuel(e.target.value)}>
                      <option>Gasolina Comum</option>
                      <option>Gasolina Aditivada</option>
                      <option>Etanol</option>
                      <option>Diesel</option>
                    </select>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Nome do Posto</label>
                    <input type="text" className="form-input" value={formStation} onChange={e => setFormStation(e.target.value)} />
                  </div>

                  <button type="submit" className="btn-primary" style={{ marginTop: '10px' }}>Salvar Abastecimento</button>
                </form>
              </div>
            </div>
          {/* MODAL CONEXÃO SAMSUNG S22 */}
          {isQrModalOpen && (
            <div className="modal-overlay" onClick={() => setIsQrModalOpen(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()} style={{ textAlign: 'center' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.1rem', fontWeight: 700 }}>📱 Conectar Samsung Galaxy S22</h3>
                  <button onClick={() => setIsQrModalOpen(false)} style={{ background: 'none', border: 'none', color: 'var(--text-main)', fontSize: '1.2rem', cursor: 'pointer' }}>✕</button>
                </div>

                <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '14px' }}>
                  Abra a câmera do seu Galaxy S22 e escaneie o código abaixo para abrir o aplicativo:
                </p>

                <div style={{ background: '#ffffff', padding: '12px', borderRadius: '16px', display: 'inline-block', marginBottom: '14px' }}>
                  <canvas ref={qrCanvasRef}></canvas>
                </div>

                <div style={{ background: 'var(--bg-main)', padding: '12px', borderRadius: '12px', border: '1px solid var(--border-color)', textWrap: 'wrap', wordBreak: 'break-all', fontSize: '0.85rem', fontWeight: 700, color: 'var(--primary)', marginBottom: '16px' }}>
                  {localAppUrl}
                </div>

                <div style={{ textAlign: 'left', background: 'var(--bg-card)', padding: '14px', borderRadius: '14px', border: '1px solid var(--border-color)', fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                  <div style={{ fontWeight: 700, color: 'var(--text-main)', marginBottom: '6px' }}>📲 Como Instalar como App no S22:</div>
                  <ol style={{ paddingLeft: '18px', display: 'flex', flexDirection: 'column', gap: '4px' }}>
                    <li>Abra a URL no <strong>Chrome</strong> ou <strong>Samsung Internet</strong>.</li>
                    <li>Toque no menu de 3 pontos (⋮) no canto superior.</li>
                    <li>Selecione <strong>"Adicionar à tela inicial"</strong> ou <strong>"Instalar aplicativo"</strong>.</li>
                    <li>Pronto! O ícone aparecerá na sua gaveta de aplicativos!</li>
                  </ol>
                </div>
              </div>
            </div>
          )}



          {/* BOTTOM BAR */}
          <nav className="bottom-nav">
            <button className={`nav-btn ${activeTab === 'inicio' ? 'active' : ''}`} onClick={() => setActiveTab('inicio')}>
              <span>🏠</span><span>Início</span>
            </button>
            <button className={`nav-btn ${activeTab === 'historico' ? 'active' : ''}`} onClick={() => setActiveTab('historico')}>
              <span>📜</span><span>Histórico</span>
            </button>
            <button className="fab" onClick={() => setIsRefuelModalOpen(true)} title="Adicionar">+</button>
            <button className={`nav-btn ${activeTab === 'flex' ? 'active' : ''}`} onClick={() => setActiveTab('flex')}>
              <span>🔥</span><span>Flex</span>
            </button>
            <button className={`nav-btn ${activeTab === 'manutencao' ? 'active' : ''}`} onClick={() => setActiveTab('manutencao')}>
              <span>🛠️</span><span>Revisão</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
